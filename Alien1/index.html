<script>
/* ---------- VIDEO ---------- */
var VIDEO_PRINCIPAL = "fd3PJfv7SaY";
var DEMORA_GIF = 5000;          // ms que tarda el GIF en moverse desde que el video empieza
var player = null;
var playerListo = false;
var videoActual = VIDEO_PRINCIPAL;
var gifActivo = true;           // se congela al cargar la imagen (ver más abajo)
var temporizadorGif = null;

// Cargar la API de YouTube
(function(){
  var s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
})();

function onYouTubeIframeAPIReady(){
  player = new YT.Player("visor", {
    events: {
      onReady: function(){ playerListo = true; },
      onStateChange: cambioEstado
    }
  });
}

function cambioEstado(e){
  // 1 = reproduciendo, 2 = pausa, 0 = terminado
  if(e.data === 1 && videoActual === VIDEO_PRINCIPAL){
    if(!gifActivo && !temporizadorGif){
      temporizadorGif = setTimeout(function(){
        temporizadorGif = null;
        if(videoActual === VIDEO_PRINCIPAL && player.getPlayerState() === 1){
          estadoGif(true);
        }
      }, DEMORA_GIF);
    }
  } else if(e.data === 2 || e.data === 0){
    cancelarTemporizador();
  }
}

function cancelarTemporizador(){
  if(temporizadorGif){ clearTimeout(temporizadorGif); temporizadorGif = null; }
}

/* ---------- GIF (se mueve solo con el video principal) ---------- */
function estadoGif(activo, opaco){
  var im = document.getElementById("gif");
  var cv = document.getElementById("gifFijo");

  if(activo){
    gifActivo = true;
    cv.style.display = "none";
    im.style.display = "";
    im.style.opacity = "1";
    return;
  }

  // congelar: copiar el fotograma actual antes de ocultar el GIF (solo si estaba en movimiento)
  if(gifActivo){
    cv.width  = im.naturalWidth;
    cv.height = im.naturalHeight;
    cv.getContext("2d").drawImage(im, 0, 0);
    im.style.display = "none";
    cv.style.display = "";
    gifActivo = false;
  }
  // opaco solo en los demás videos; quieto sin opacidad en el principal
  cv.style.opacity = opaco ? "0.35" : "1";
}

// Al abrir la página el GIF empieza quieto y SIN opacidad
(function(){
  var im = document.getElementById("gif");
  function congelarInicial(){ estadoGif(false, false); }
  if(im.complete && im.naturalWidth) congelarInicial();
  else im.addEventListener("load", congelarInicial);
})();

/* ---------- BOTONES ---------- */
function cargarVideo(id){
  videoActual = id;
  cancelarTemporizador();
  if(playerListo){
    player.loadVideoById(id);
  } else {
    document.getElementById("visor").src =
      "https://www.youtube.com/embed/" + id + "?autoplay=1&playsinline=1&enablejsapi=1";
  }
  // el GIF se congela: opaco en los demás videos, sin opacidad en el principal
  // (en el principal se vuelve a mover a los 5 s de que el video empiece)
  estadoGif(false, id !== VIDEO_PRINCIPAL);
}

/* ---------- ESCALA DE LA PÁGINA ---------- */
function ajustar(){
  var e=document.getElementById("escala");
  e.style.transform="none";
  var h=e.offsetHeight;
  var k=Math.min(window.innerHeight/h, window.innerWidth/900, 1);
  e.style.transform="scale("+k+")";
  e.style.top=Math.max(0,(window.innerHeight-h*k)/2)+"px";
}

function mostrar(){
  ajustar();
  document.getElementById("escala").style.visibility="visible";
}

(function(){
  var pendientes=0, listo=false;
  function fin(){ if(!listo){ listo=true; mostrar(); } }
  function una(){ ajustar(); pendientes--; if(pendientes<=0) fin(); }
  for(var i=0;i<document.images.length;i++){
    var im=document.images[i];
    if(!im.complete){
      pendientes++;
      im.addEventListener("load",una);
      im.addEventListener("error",una);
    }
  }
  if(pendientes===0) fin();
  setTimeout(fin,2000);
  window.addEventListener("load",ajustar);
  window.addEventListener("resize",ajustar);
})();
</script>
