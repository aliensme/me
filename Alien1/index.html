<script>
/* ---------- CONFIGURACIÓN ---------- */
var VIDEO_PRINCIPAL = "fd3PJfv7SaY";
var DURACION_FADE = 33;   // segundos: el GIF se aclara hasta el 33 y ahí cambia al GIF normal
var INICIO_MOVIMIENTO = 5; // segundos: el GIF lento empieza a moverse

// GIF distinto para cada uno de los otros videos.
// Pega la URL del gif entre las comillas. Si queda vacío ("") no se muestra nada.
var GIFS_OTROS = {
  "Mroued07Z2U": "",   // botón ★✩ nº 2
  "sk_T8BYNEI4": "",   // botón ★✩ nº 3
  "A2aixdFINOQ": ""    // botón ★✩ nº 4
};

var player = null;
var playerListo = false;
var videoActual = VIDEO_PRINCIPAL;
var fase = 1;             // 0 = quieto, 1 = GIF lento, 2 = GIF normal (arranca en 0 al cargar la imagen)

/* ---------- VIDEO ---------- */
// Cargar la API de YouTube
(function(){
  var s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
})();

function onYouTubeIframeAPIReady(){
  player = new YT.Player("visor", {
    events: {
      onReady: function(){
        playerListo = true;
        setInterval(actualizarGifPrincipal, 250);
      },
      onStateChange: function(e){
        if(e.data === 1) actualizarGifPrincipal();   // 1 = reproduciendo
      }
    }
  });
}

/* ---------- GIF PRINCIPAL ---------- */
// brillo: 0 = totalmente oscuro, 1 = normal
function aplicarBrillo(b){
  var f = "brightness(" + b + ")";
  ["gif","gifFijo","gifRapido"].forEach(function(id){
    document.getElementById(id).style.filter = f;
  });
}

// Todo sigue el segundo del video principal:
//  - seg. 0 a 5:   GIF quieto (oscuro, aclarándose)
//  - seg. 5 a 33:  GIF lento en movimiento, siguiendo con el fade
//  - desde el 33:  GIF normal en movimiento, con brillo normal
function actualizarGifPrincipal(){
  if(!playerListo || videoActual !== VIDEO_PRINCIPAL) return;
  var st = player.getPlayerState();
  if(st !== 1 && st !== 2) return;          // solo mientras reproduce o está en pausa
  var t = player.getCurrentTime();
  aplicarBrillo(Math.min(1, t / DURACION_FADE).toFixed(3));
  setFase(t >= DURACION_FADE ? 2 : (t >= INICIO_MOVIMIENTO ? 1 : 0));
}

function setFase(n){
  if(n === fase) return;
  var lento  = document.getElementById("gif");
  var fijo   = document.getElementById("gifFijo");
  var rapido = document.getElementById("gifRapido");

  // al quedar quieto, copiar el fotograma actual del GIF lento
  if(n === 0 && fase === 1){
    fijo.width  = lento.naturalWidth;
    fijo.height = lento.naturalHeight;
    fijo.getContext("2d").drawImage(lento, 0, 0);
  }
  lento.style.display  = (n === 1) ? "" : "none";
  fijo.style.display   = (n === 0) ? "" : "none";
  rapido.style.display = (n === 2) ? "" : "none";
  fase = n;
}

// Al abrir la página el GIF empieza quieto y completamente oscuro
aplicarBrillo(0);
(function(){
  var im = document.getElementById("gif");
  function congelarInicial(){ setFase(0); }
  if(im.complete && im.naturalWidth) congelarInicial();
  else im.addEventListener("load", congelarInicial);
})();

/* ---------- MOSTRAR / OCULTAR GIFS SEGÚN EL VIDEO ---------- */
function mostrarGifsPara(id){
  var principal = document.getElementById("gifPrincipal");
  var otro = document.getElementById("gifOtro");

  if(id === VIDEO_PRINCIPAL){
    otro.style.display = "none";
    principal.style.display = "";
    principal.style.visibility = "visible";
    setFase(0);                // vuelve quieto...
    aplicarBrillo(0);          // ...y oscuro, hasta que el video avance
    return;
  }

  // otros videos: el GIF principal se congela y se esconde
  setFase(0);
  var url = GIFS_OTROS[id];
  if(url){
    principal.style.display = "none";
    otro.onload = function(){ ajustar(); };
    otro.src = url;
    otro.style.display = "";
  } else {
    otro.style.display = "none";
    principal.style.display = "";
    principal.style.visibility = "hidden";   // no se ve, pero conserva el espacio
  }
}

/* ---------- BOTONES ---------- */
function cargarVideo(id){
  videoActual = id;
  if(playerListo){
    player.loadVideoById(id);
  } else {
    document.getElementById("visor").src =
      "https://www.youtube.com/embed/" + id + "?autoplay=1&playsinline=1&enablejsapi=1";
  }
  mostrarGifsPara(id);
}

/* ---------- ESCALA DE LA PÁGINA ---------- */
function ajustar(){
  var e=document.getElementById("escala");
  e.style.transform="none";
  var h=e.offsetHeight;
  var k=Math.min(window.innerHeight/h, window.innerWidth/900, 1);
  e.style.transform="scale("+k+")";
  e.style.top=Math.max(0,(window.innerHeight-h*k)/2)+"px";
}

function mostrar(){
  ajustar();
  document.getElementById("escala").style.visibility="visible";
}

(function(){
  var pendientes=0, listo=false;
  function fin(){ if(!listo){ listo=true; mostrar(); } }
  function una(){ ajustar(); pendientes--; if(pendientes<=0) fin(); }
  for(var i=0;i<document.images.length;i++){
    var im=document.images[i];
    if(!im.complete){
      pendientes++;
      im.addEventListener("load",una);
      im.addEventListener("error",una);
    }
  }
  if(pendientes===0) fin();
  setTimeout(fin,2000);
  window.addEventListener("load",ajustar);
  window.addEventListener("resize",ajustar);
})();
</script>
